name: catalog-validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate master catalog (fail closed)
        run: python3 scripts/validate_catalog.py
      - name: Catalog validator unit tests
        run: python3 -m unittest discover -s tests -v
